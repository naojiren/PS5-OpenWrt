# A single-port IPv4 gateway must keep same-interface traffic on this gateway.
net.ipv4.ip_forward=1
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.rp_filter=0
net.ipv4.conf.default.rp_filter=0
# LAN bridge clients keep their own IP packets when crossing wired/Wi-Fi
# ports. Routed traffic still uses the normal IPv4 firewall and NAT path.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
